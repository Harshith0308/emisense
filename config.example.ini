; Copy this file to config.local.ini and set your own port.
;
;   copy config.example.ini config.local.ini      (Windows)
;   cp   config.example.ini config.local.ini      (Linux / macOS)
;
; config.local.ini is gitignored on purpose. Four laptops, four different
; ports - this must not be shared or committed.
;
; Find the port in Arduino IDE under Tools > Port.
;   Windows  COM3, COM4, ...
;   Linux    /dev/ttyUSB0 or /dev/ttyACM0
;   macOS    /dev/cu.usbserial-0001

[serial]
port = COM3
